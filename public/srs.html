<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRS IEEE 830 — AcadeQR</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #059669;
      --primary-dark: #047857;
      --accent: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .topbar-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      background: #d1fae5;
      color: #065f46;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: #f1f5f9; }
    .container {
      max-width: 1024px;
      margin: 2rem auto;
      padding: 2.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }
    h1, h2, h3, h4 {
      color: #0f172a;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    h1 { font-size: 2rem; margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; }
    h2 { font-size: 1.45rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    h3 { font-size: 1.15rem; }
    blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      background: #f0fdf4;
      border-left: 4px solid var(--primary);
      border-radius: 0 0.5rem 0.5rem 0;
      color: #064e3b;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f1f5f9;
      font-weight: 700;
    }
    code {
      background: #f1f5f9;
      padding: 0.15rem 0.35rem;
      border-radius: 0.3rem;
      font-size: 0.875em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .mermaid {
      margin: 1.5rem 0;
      padding: 1rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow-x: auto;
      text-align: center;
    }
    @media (max-width: 640px) {
      .container { margin: 0.75rem; padding: 1.25rem; }
    }
    @media print {
      .topbar { display: none !important; }
      body { background: #ffffff; }
      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
      }
      .mermaid { break-inside: avoid; }
      table { break-inside: auto; }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span>AcadeQR — Especificación de Requisitos de Software (SRS)</span>
      <span class="badge">IEEE 830</span>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/srs-ieee830.md" download="SRS-AcadeQR-IEEE830.md">
        Descargar Markdown (.md)
      </a>
      <button class="btn btn-primary" onclick="window.print()">
        Guardar como PDF / Imprimir
      </button>
    </div>
  </header>

  <main id="content" class="container">
    <p>Cargando documento SRS...</p>
  </main>

  <script>
    async function loadSrs() {
      const container = document.getElementById('content');
      try {
        const res = await fetch('/srs-ieee830.md');
        if (!res.ok) throw new Error('No se pudo cargar /srs-ieee830.md');
        const md = await res.text();

        container.innerHTML = marked.parse(md);

        const mermaidBlocks = container.querySelectorAll('pre code.language-mermaid');
        mermaidBlocks.forEach((block) => {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
        });

        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
        await mermaid.run({ querySelector: '.mermaid' });
      } catch (err) {
        container.innerHTML = '<p style="color:#b91c1c;">Error cargando el SRS: ' + err.message + '</p>';
      }
    }
    loadSrs();
  </script>
</body>
</html>
